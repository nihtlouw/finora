name: Finora PR checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/ux-systematic-optimization

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/neondb
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/neondb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Transition contract QA
        run: npm run qa:transition-matrix
      - name: Production build
        run: npm run build
      - name: ESLint (informational)
        continue-on-error: true
        run: npm run lint
